<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Raven OSINT Platform Logo</title>
  <desc id="desc">Horizontal lockup with raven shield icon and text mark for the Raven OSINT platform.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="70" y1="46" x2="406" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="122" y1="140" x2="350" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.55" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="294" y1="236" x2="392" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g transform="translate(0,8)">
    <path d="M238 20L382 84L411 247C400 334 334 402 238 430C142 402 76 334 65 247L94 84L238 20Z" fill="url(#bgGrad)" filter="url(#softShadow)"/>
    <path d="M238 46L359 100L384 244C374 314 319 372 238 398C157 372 102 314 92 244L117 100L238 46Z" fill="none" stroke="#334155" stroke-width="7"/>

    <path d="M126 286C117 246 121 203 142 165C168 120 214 93 270 87C237 107 213 139 203 180C188 239 202 290 243 324C207 324 171 313 141 298C135 294 130 290 126 286Z" fill="#0b1220" opacity="0.92"/>
    <path d="M141 284C139 228 167 176 216 150C254 129 299 131 337 155C313 160 294 173 281 190C311 192 337 210 353 238C328 233 305 235 282 247C260 260 244 281 237 308C208 314 179 310 153 297C148 293 144 289 141 284Z" fill="url(#featherGrad)"/>
    <path d="M281 217L383 208L311 255Z" fill="url(#beakGrad)"/>
    <circle cx="257" cy="195" r="7" fill="#0f172a"/>
    <circle cx="260" cy="193" r="2" fill="#e2e8f0"/>
    <path d="M157 328C188 342 220 349 254 347" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.78"/>
  </g>

  <g transform="translate(470,116)">
    <text x="0" y="120" font-size="144" font-weight="800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" letter-spacing="6" fill="#0f172a">RAVEN</text>
    <rect x="2" y="148" width="580" height="6" rx="3" fill="#38bdf8"/>
    <text x="0" y="214" font-size="46" font-weight="600" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" letter-spacing="3" fill="#334155">OSINT PLATFORM</text>
    <text x="0" y="262" font-size="28" font-weight="500" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" letter-spacing="1.2" fill="#64748b">Security Intelligence and Incident Monitoring</text>
  </g>
</svg>
